name: Pull ESPN Fantasy Data

on:
  schedule:
    - cron: '0 13 * * *'   # daily at 9am ET — adjust once the season's live
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python espn_pull.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espn_data.json
          git diff --staged --quiet || git commit -m "Update ESPN data [auto]"
          git push
