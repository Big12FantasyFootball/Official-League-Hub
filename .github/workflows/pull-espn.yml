name: Pull ESPN Fantasy Data

# Cron is UTC. The East Coast is on EDT (UTC-4) until Nov 1, then EST
# (UTC-5), so the windows are written wide enough to survive that shift
# without a mid-season edit.
#
# The original version only covered Sunday afternoon through Monday night.
# That was wrong: the 2026 season OPENS on Wednesday Sep 9 (NE @ SEA, 8:20pm
# ET) with a second game Thursday Sep 10, and Thursday Night Football runs
# most weeks after that. Saturday games appear in December, plus the Black
# Friday game. Rather than enumerate every exception, the nightly window now
# covers 8pm-1am ET EVERY day, which catches every primetime kickoff on any
# day of the week:
#
#   Every night  8pm ET -> 1am ET   : every 30 min  (Wed/Thu/Fri/Sat/Sun/Mon
#                                                    primetime, incl. SNF+MNF)
#   Sunday       9am ET -> 8pm ET   : every 30 min  (London games + main slate)
#   Daily        9am ET             : once          (finals, waivers, injuries)
#
# GitHub delays scheduled runs under load, especially on the hour, so the
# minute offsets are deliberately off-cadence.
on:
  schedule:
    # Every night, 8pm-1am ET (00:00-04:59 UTC). Covers Wednesday's opener,
    # TNF, Sunday Night Football, Monday Night Football and Saturday games.
    - cron: '7,37 0-4 * * *'
    # Sunday daytime, 9am-8pm ET (13:00-23:59 UTC) — London kickoffs onward.
    - cron: '7,37 13-23 * * 0'
    # Daily catch-up at 9am ET (13:00 UTC) — official finals, waivers, injuries
    - cron: '13 13 * * *'
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# If a run is still going when the next one fires, let the newer one win
# rather than stacking up commits from stale data.
concurrency:
  group: pull-espn
  cancel-in-progress: true

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python espn_pull.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espn_data.json
          git diff --staged --quiet || git commit -m "Update ESPN data [auto]"
          # Another run may have pushed while this one was working; rebase
          # onto it instead of failing the job outright.
          git pull --rebase --autostash origin main || true
          git push
