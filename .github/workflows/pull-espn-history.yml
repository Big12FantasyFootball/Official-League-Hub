name: Pull ESPN Fantasy History

on:
  workflow_dispatch:   # manual trigger only — past seasons don't change often

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python espn_history_pull.py
      - name: Commit history data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espn_history.json
          git diff --staged --quiet || git commit -m "Add ESPN history data [auto]"
          git push
